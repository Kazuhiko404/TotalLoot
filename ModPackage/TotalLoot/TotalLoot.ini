; TotalLoot configuration.
; Keys and section names are case-insensitive. Lines starting with ; or # are comments.
; Edit this file in the Kenshi mod folder; the deploy script never overwrites it.

[General]
; How Loot and Loot all work:
;   0 = the character walks to each body and loots it on arrival (default)
;   1 = instant remote loot of everything in range (cheat)
CheatLoot=0
; Loot all / AUTO LOOT search radius around the body, in metres.
LootRadius=20
; Distance at which the looter counts as arrived at a body, in metres.
ArriveDistance=5

[Looting]
; 1 = clear the "stolen" flag on looted items so they can be sold freely.
clear_stolen_flag=0
; 1 = a walking loot stops when the looter enters combat.
cancel_on_combat=1
; 1 = a walking loot stops when a nearby ally is attacked.
cancel_when_nearby_ally_attacked=1

; ---- Better Looting (copied from BetterLooting by XxAtreuSSxX, GPLv3) ----
[Rules]
; Items worth less than this are skipped.
MinValue=0
; Items worth less per kg than this are skipped.
MinValuePerKg=0.0
; 1 = also take stolen items.
AllowStolen=1

[Categories]
; 1 = loot this category, 0 = skip it.
Weapons=1
Armour=1
Food=1
Medicine=1
Tools=1
Materials=1
Blueprints=1
Ammo=1
Robotics=1
Books=1
Narcotics=1
SeveredLimbs=1
Other=1

[Behavior]
; 1 = most valuable items first.
BestItemsFirst=0
; 1 = prefer the backpack when it has room.
PreferBackpack=1
; Virtual-key code of the loot hotkey (45 = Insert).
ActivationVirtualKey=45

[UI]
; Settings window language: es or en.
Language=es
